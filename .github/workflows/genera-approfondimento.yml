name: Genera bozza Approfondimenti

on:
  push:
    branches: [main]
    paths:
      - "scripts/genera_approfondimento.py"
      - ".github/workflows/genera-approfondimento.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generazione-approfondimenti
  cancel-in-progress: false

jobs:
  genera-bozza:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verifica fonti istituzionali e genera bozza
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: python scripts/genera_approfondimento.py
      - name: Apri richiesta di revisione
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Crea bozza editoriale per Approfondimenti"
          title: "Revisione editoriale: nuovo approfondimento notarile"
          body: |
            Bozza generata a partire da pagine e articoli del Consiglio Nazionale del Notariato.
            
            **Non è pubblicata sul sito.** Verificare ogni informazione, aggiornare le fonti e approvare il contenuto prima della pubblicazione.
          branch: "editoriale/bozza-approfondimento"
          delete-branch: true
          add-paths: |
            approfondimenti/bozze/*.md
