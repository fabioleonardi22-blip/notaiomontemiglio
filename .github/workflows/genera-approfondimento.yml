name: Pubblica automaticamente gli Approfondimenti

on:
  push:
    branches: [main]
    paths:
      - "scripts/genera_approfondimento.py"
      - ".github/workflows/genera-approfondimento.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubblicazione-approfondimenti
  cancel-in-progress: false

jobs:
  pubblica-articolo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verifica fonti, genera e valida l'articolo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: python scripts/genera_approfondimento.py
      - name: Pubblica i file verificati su main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add approfondimenti/articoli/
          git add approfondimenti/articoli.json
          if git diff --cached --quiet; then
            echo "Nessun nuovo articolo da pubblicare."
            exit 0
          fi
          git commit -m "Pubblica nuovo approfondimento verificato"
          git push origin HEAD:main
